name: Publish OTA pack to certs branch

on:
  workflow_dispatch:
  push:
    paths:
      - "server/ota/public/**"
      - "server/ota/scripts/gen-pack.sh"
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure pack exists
        run: |
          if [[ ! -f server/ota/public/pack.json ]]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq openssl
            chmod +x server/ota/scripts/gen-pack.sh
            ./server/ota/scripts/gen-pack.sh
          fi
          openssl x509 -in server/ota/public/server.crt -noout -subject -enddate -ext subjectAltName

      - name: Publish to certs branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          if git ls-remote --exit-code --heads origin certs >/dev/null 2>&1; then
            git clone --depth 1 --branch certs "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tmp"
          else
            git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tmp"
            cd "$tmp"
            git checkout --orphan certs
            git rm -rf . >/dev/null 2>&1 || true
            cd -
          fi
          cp server/ota/public/pack.json \
             server/ota/public/server.crt \
             server/ota/public/server.pem \
             server/ota/public/ca.crt \
             server/ota/public/commonName.txt \
             "$tmp/"
          cd "$tmp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "ota: publish tetherless.dev pack"
          git push -u origin certs
